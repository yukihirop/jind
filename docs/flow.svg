<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#66706e"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#d9ded9;stroke-width:1.2}
    .jev{stroke:#0e7c7b;stroke-width:2}
    .t{fill:#1b1f1e}
    .m{fill:#66706e;font-size:11px}
    .l{stroke:#66706e;stroke-width:1.6;fill:none}
    @media (prefers-color-scheme: dark){
      .box{fill:#181d1c;stroke:#2b3331}
      .jev{stroke:#4fc1bf}
      .t{fill:#e6eae8}
      .m{fill:#97a19e}
    }
  </style>

  <rect class="box" x="16" y="40" width="80" height="44" rx="8"/>
  <text class="t" x="56" y="66" text-anchor="middle">words</text>

  <path class="l" d="M96,62 L130,62" marker-end="url(#a)"/>

  <rect class="box" x="130" y="40" width="150" height="44" rx="8"/>
  <text class="t" x="205" y="60" text-anchor="middle">rules</text>
  <text class="m" x="205" y="76" text-anchor="middle">paths  *.log  +7d  delete</text>

  <path class="l" d="M280,62 L318,62" marker-end="url(#a)"/>

  <rect class="box" x="318" y="40" width="120" height="44" rx="8"/>
  <text class="t" x="378" y="66" text-anchor="middle">all resolved?</text>

  <!-- yes: straight to find -->
  <path class="l" d="M438,52 L700,52" marker-end="url(#a)"/>
  <text class="m" x="560" y="46" text-anchor="middle">yes · offline, no prompt</text>

  <!-- no: down through jev, repair and confirm -->
  <path class="l" d="M378,84 L378,112 L440,112" marker-end="url(#a)"/>
  <text class="m" x="392" y="104">no</text>

  <rect class="box jev" x="440" y="90" width="96" height="44" rx="8"/>
  <text class="t" x="488" y="110" text-anchor="middle">jev</text>
  <text class="m" x="488" y="126" text-anchor="middle">one request</text>

  <path class="l" d="M536,112 L556,112" marker-end="url(#a)"/>

  <rect class="box" x="556" y="90" width="76" height="44" rx="8"/>
  <text class="t" x="594" y="110" text-anchor="middle">repair</text>
  <text class="m" x="594" y="126" text-anchor="middle">7 + days</text>

  <path class="l" d="M632,112 L652,112" marker-end="url(#a)"/>

  <rect class="box" x="652" y="90" width="84" height="44" rx="8"/>
  <text class="t" x="694" y="110" text-anchor="middle">confirm</text>
  <text class="m" x="694" y="126" text-anchor="middle">[Y/n/e]</text>

  <path class="l" d="M736,112 L760,112 L760,74" marker-end="url(#a)"/>

  <rect class="box" x="700" y="30" width="164" height="44" rx="8"/>
  <text class="t" x="782" y="50" text-anchor="middle">find</text>
  <text class="m" x="782" y="66" text-anchor="middle">spawned, no shell</text>
</svg>
