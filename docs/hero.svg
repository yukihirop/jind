<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a1a"/>
      <stop offset="1" stop-color="#132726"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc1bf"/>
      <stop offset="1" stop-color="#8fd9be"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4fc1bf"/>
    </marker>
  </defs>
  <rect width="880" height="230" rx="14" fill="url(#bg)"/>

  <!-- wordmark -->
  <text x="40" y="92" font-size="64" font-weight="700" fill="url(#accent)" letter-spacing="-2">jind</text>
  <text x="40" y="126" font-size="17" fill="#97a19e">jev × find</text>
  <text x="40" y="166" font-size="14" fill="#c9d1ce">Say what you are looking for, in any order.</text>
  <text x="40" y="188" font-size="14" fill="#c9d1ce">Get the find you meant. Confirmed before it runs.</text>

  <!-- scattered words -->
  <g font-size="14" fill="#e6eae8">
    <rect x="400" y="46" width="40" height="26" rx="6" fill="#1f3331"/><text x="411" y="64">log</text>
    <rect x="452" y="46" width="52" height="26" rx="6" fill="#1f3331"/><text x="463" y="64">files</text>
    <rect x="516" y="46" width="52" height="26" rx="6" fill="#1f3331"/><text x="527" y="64">older</text>
    <rect x="400" y="82" width="46" height="26" rx="6" fill="#1f3331"/><text x="411" y="100">than</text>
    <rect x="458" y="82" width="70" height="26" rx="6" fill="#1f3331"/><text x="469" y="100">7 days</text>
    <rect x="540" y="82" width="34" height="26" rx="6" fill="#1f3331"/><text x="551" y="100">in</text>
    <rect x="400" y="118" width="86" height="26" rx="6" fill="#1f3331"/><text x="411" y="136">/var/log</text>
    <rect x="498" y="118" width="64" height="26" rx="6" fill="#2b1f1f"/><text x="509" y="136" fill="#f07178">delete</text>
  </g>

  <!-- arrow -->
  <path d="M600,96 L630,96" stroke="#4fc1bf" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="602" y="84" font-size="11" fill="#4fc1bf">jev</text>

  <!-- find: 長い行は textLength で幅を固定(フォントが変わってもはみ出さない) -->
  <g font-size="12" fill="#e6eae8">
    <rect x="640" y="36" width="224" height="134" rx="8" fill="#0b1413" stroke="#2b3331"/>
    <text x="652" y="58"><tspan fill="#8fd9be">find</tspan> /var/log \</text>
    <text x="666" y="78"><tspan fill="#7ed6d4">-type</tspan> f \</text>
    <text x="666" y="98" textLength="150" lengthAdjust="spacingAndGlyphs"><tspan fill="#7ed6d4">-iname</tspan> '*.log' \</text>
    <text x="666" y="118"><tspan fill="#7ed6d4">-mtime</tspan> <tspan fill="#f0c96a">+7</tspan> \</text>
    <text x="666" y="138"><tspan fill="#f07178">-delete</tspan></text>
    <text x="652" y="160" fill="#97a19e" font-size="11" textLength="200" lengthAdjust="spacingAndGlyphs">delete these 42 entries? [y/N/e]</text>
  </g>
</svg>
